<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>術語表 · VEX IQ Level Up 自學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="topbar" class="topbar"></header>
<main>
  <h1>術語表（中英對照）</h1>
  <p class="muted">圖紙、Game Manual 和裁判都用英文，所以英文要記得。新生前置課第 1 節要背零件部分。</p>
  <input type="text" id="q" placeholder="搜尋：中文或英文" style="margin:12px 0">
  <div id="list"></div>
</main>
<footer>規則依據 Level Up Game Manual v2.1（2026-10-08）。</footer>
<script src="assets/app.js"></script>

      ['自動程式', 'Autonomous', '不用控制器、機器自己跑的程式。'],
      ['Virtual Skills', 'Virtual Skills', '官方瀏覽器 3D 模擬，用 Hero Bot 跑真場地。'],
      ['韌體', 'VEXos (Firmware)', '主腦系統，比賽要用規定版本以上。'],
      ['迭代', 'Iteration', '改一樣 → 測試 → 記錄 → 再改。'],
      ['原型', 'Prototype', '快速砌出來試概念的版本。']
    ]]
  ];
  var el = document.getElementById('list');
  function render(q) {
    q = (q || '').trim().toLowerCase();
    el.innerHTML = G.map(function (sec) {
      var rows = sec[2].filter(function (r) { return !q || (r[0] + r[1] + r[2]).toLowerCase().indexOf(q) >= 0; });
      if (!rows.length) return '';
      return '<section class="card" id="' + sec[0] + '"><h2>' + sec[1] + '</h2><div class="table-scroll"><table><thead><tr><th>中文</th><th>英文</th><th>解釋</th></tr></thead><tbody>' +
        rows.map(function (r) { return '<tr><td><b>' + r[0] + '</b></td><td>' + r[1] + '</td><td class="small">' + r[2] + '</td></tr>'; }).join('') + '</tbody></table></div></section>';
    }).join('') || '<p class="muted">找不到。</p>';
  }
  render('');
  document.getElementById('q').addEventListener('input', function () { render(this.value); });
})();
</script>
</body>
</html>
