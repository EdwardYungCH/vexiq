<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>規則摘要 · VEX IQ Level Up 自學</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header id="topbar" class="topbar"></header>
<main>
  <h1>Level Up 規則摘要（繁中）</h1>
  <p class="muted">每條規則一句人話，後面是官方條號。這是本站自己寫的簡化版，不是官方文件：有爭議時以英文 Game Manual 原文為準，裁判只認原文。依據 v2.1（2026-10-08）。</p>
  <div class="btnrow">
    <a class="btn sm" href="https://link.vex.com/docs/26-27/viqrc/game-manual" target="_blank" rel="noopener">英文原文 PDF ↗</a>
    <a class="btn sm ghost" href="https://vexrobot.cn/competitions/level-up" target="_blank" rel="noopener">簡體中文譯本（VEX 中國社區）↗</a>
  </div>
  <input type="text" id="q" placeholder="搜尋：例如 換手、摩打、黃袋、SG6" style="margin:12px 0">
  <div id="rules"></div>
  <section class="notice">簡體譯本由內地社區製作，用語和香港不同（機器人＝機械人、電機＝摩打、代碼＝程式），版本可能落後官方。學生先看本頁摘要，再看原文。</section>
</main>
<footer>規則依據 Level Up Game Manual v2.1（2026-10-08）。</footer>
<script src="assets/app.js"></script>
<script>
(function () {
  var R = [
    ['計分 SC', [
      ['SC1', '比賽完結、所有機器和豆袋停定後才計分；裁判計分時不會移動任何東西。'],
      ['SC2', '計分由主裁判目測決定；只有駕駛隊成員（學生）可以提出計分異議，成年人不可以。'],
      ['SC3', 'Floor Goal：豆袋要完全在 goal 內、沒有機器碰住、顏色相同或黃色，才算 1 分。'],
      ['SC4', 'L1／L2／L3：豆袋由該層表面（或其他已入的袋）承托、沒有機器碰住、顏色相同或黃色；只計最高那一層。分數 3／6／12。'],
      ['SC5', 'L4：只有黃袋可以得分（16 分），由 L4 承托且沒有機器碰住。']
    ]],
    ['比賽規則 SG', [
      ['SG1', '開賽時機器要在合法起始位置、符合尺寸、計時開始前不可動、和檢錄時一樣。'],
      ['SG2', '開賽後機器水平投影不可超過 11 × 24 吋（279 × 610 mm），向上伸都要守住這個腳印。'],
      ['SG3', '開賽後向上伸展無上限。'],
      ['SG4', '豆袋出了場就不可以放回；掉入金字塔內部的豆袋當作出場。'],
      ['SG5', '每部機開賽時有 1 個黃色預載，只可以碰住自己的機器，不可碰場地元件、goal 或其他豆袋。'],
      ['SG6', '同一時間最多持有或推動 1 個豆袋；碰一碰其他袋不算，但推住兩個就犯規。'],
      ['SG7', '豆袋由入袋員經同色 Load Zone 一次一個放入：要平放在區內、區內沒有其他袋、手離開後機器才可以碰、袋未被機器碰前要靜止。']
    ]],
    ['安全 S', [
      ['S1', '安全操作，不可損壞場地；駕駛隊成員任何時候都不可以踏入場地。'],
      ['S2', '學生在整個比賽期間必須有成年人督導。'],
      ['S3', '每位學生要有已簽的參加者同意書（release form）才可以參賽。']
    ]],
    ['一般 G', [
      ['G1', '所有人要遵守行為守則（Code of Conduct）。'],
      ['G2', '學生為本政策（Student Centered Policy）：機器由學生設計、砌和操作，成年人只可以指導。'],
      ['G3', '規則用常理理解；無心之失一般會從寬處理。'],
      ['G4', '學生要符合參賽資格政策（年級／年齡）。'],
      ['G5', '機器違規無論有心無心都當檢錄不過；刻意繞過規則屬違反比賽精神。']
    ]],
    ['比賽進行 GG', [
      ['GG1', '只有本隊駕駛員（和機上程式）可以操作機器；駕駛隊要留在駕駛區，不可用其他裝置或和場外通訊。'],
      ['GG2', '排到的場次機器不到場即棄權，該場 0 分。'],
      ['GG3', '放上場的機器要已準備好並即時放好，否則可被移離該場。'],
      ['GG4', '駕駛隊不可以刻意碰場上任何東西或伸手入場地，入袋等規則另有列明的除外。'],
      ['GG5', '重賽極少，要大會和主裁判都同意。'],
      ['GG6', '被取消資格（DQ）：資格賽該隊 0 分；決賽整個聯盟 0 分；Skills 該場 0 分。'],
      ['GG7', '沒有暫停（time-out）。'],
      ['GG8', '機器不可以刻意甩件或把機構留在場上。'],
      ['GG9', '不可以損壞場地元件；意外損壞一般算輕微違規。'],
      ['GG10', '機器卡住、翻側或出界，可經主裁判批准在場中重置，手上的豆袋要拿走。'],
      ['GG11', '換手：兩位駕駛員要在餘下 0:35 至 0:25 之間換控制器；每人最多操作 35 秒；不在駕駛的成員可以按條件做入袋員。'],
      ['GG12', '計時開始前和 0:00 後機器不可以動；0:00 後才放開的豆袋不計分。'],
      ['GG13', '兩隊同意可以提早完場：停機並把控制器放在地上。'],
      ['GG14', '駕駛隊可以在該場完結後即時向主裁判上訴，但要接受最終決定。']
    ]],
    ['機器 R', [
      ['R1', '每隊只可以帶一部機，不可以在比賽中換機或砌第二部，也不可以借給其他隊。'],
      ['R2', '機器要通過檢錄，比賽中可被抽查；被發現違規會被取消該場資格。'],
      ['R3', '檢錄和每場開始時機器要放得入 11 × 20 × 15 吋（279 × 508 × 381 mm）。'],
      ['R4', '兩塊官方登記的牌照（License Plate）裝在相對兩側，不可以有多餘牌照。'],
      ['R5', '完場後豆袋要可以不用開機、不用遙控就從機器取出。'],
      ['R6', '只可以有一個 VEX IQ 主腦，不可以有其他微控制器（Arduino、Raspberry Pi 等）。'],
      ['R7', '鼓勵（非強制）讓主腦螢幕、狀態燈、電源鍵和電池方便接觸。'],
      ['R8', '要用規定版本以上的 VEXos 韌體，不可以用自改韌體。'],
      ['R9', '最多 6 個 VEX IQ Smart Motor；機上不可以有多餘摩打，即使沒接線。'],
      ['R10', '只可以用一個認可電池（第一或第二代 IQ 電池，或 AA 電池盒），不可以有後備電池在機上。'],
      ['R11', '每部機只可以有一個控制器，不可以改裝，不可以用光、聲等其他方法控制。'],
      ['R12', '只可以用官方 VEX IQ 零件和列明合法的零件；被質疑時要能證明來源。'],
      ['R13', '不可以有會損壞場地、豆袋或其他機器的機構；不可以用膠紙；不可以用其他 VEX 產品線（V5、GO 電子件等）。'],
      ['R14', '例外允許：指定橡筋、V5 軸和互通零件、HEXBUG 和 GO 的結構件、冷凍噴劑、清潔劑、少量標記用膠紙、食品級潤滑劑。'],
      ['R15', '非功能性裝飾可以用，但不可以影響性能，要符合比賽精神。'],
      ['R16', '氣動只可以用 VEX IQ 氣動套件，最多 2 個氣罐 1 個泵，不可以用其他方法儲氣。'],
      ['R17', '零件不可以改動，只有四個例外：剪金屬軸、彎曲軟性零件、剪氣管、橡筋或繩打結。']
    ]],
    ['技能賽 RSC', [
      ['RSC1', '技能賽套用一般規則，本節另有規定的除外。'],
      ['RSC2', '技能賽用一樣的計分規則。'],
      ['RSC3', '技能賽場地和聯賽不同：豆袋擺法、只有一個駕駛區和一個 Load Zone、起始位置不同。'],
      ['RSC4', '技能賽任何不在駕駛的駕駛員都可以入袋，全部經紅色 Load Zone；駕駛技能賽時駕駛員要留在駕駛區。'],
      ['RSC5', '自動程式技能賽期間可以多次拿起機器，但要放回合法起始位置。'],
      ['RSC6', '自動程式要用主腦按鍵或感應器啟動，不可以用控制器按鍵。'],
      ['RSC7', '自動程式運行時任何人不可以觸發任何控制或感應器；控制器要放離場地。'],
      ['RSC8', '可以選用「提早停止時間」：自願提早完場並記錄時間，只用作排名同分時的決勝。']
    ]],
    ['賽事 T', [
      ['T1', '主裁判對比賽和機器的裁決有最終決定權，大會不可以推翻。'],
      ['T3', '駕駛隊可以即時上訴主裁判的裁決。'],
      ['T4', '非比賽事務由大會（Event Partner）最終決定。'],
      ['T5', '場地會有少許差異，隊伍要有心理準備。'],
      ['T8–T9', '資格賽按官方賽程進行，每隊場數由大會按規定安排。'],
      ['T10–T11', '排名按資格賽平均分，同分有指定決勝方法。'],
      ['T12–T14', '決賽聯盟按指定方法組成，決賽按指定賽程進行。'],
      ['T15', '技能賽按指定賽程，要同時參加資格賽才可以參加技能賽。'],
      ['T17–T18', '技能賽排名有指定計算方法，並有全球排名。']
    ]]
  ];
  var el = document.getElementById('rules');
  function render(q) {
    q = (q || '').trim().toLowerCase();
    el.innerHTML = R.map(function (sec) {
      var rows = sec[1].filter(function (r) { return !q || (r[0] + ' ' + r[1]).toLowerCase().indexOf(q) >= 0; });
      if (!rows.length) return '';
      return '<section class="card"><h2>' + sec[0] + '</h2><div class="kv">' + rows.map(function (r) { return '<b>' + r[0] + '</b><span>' + r[1] + '</span>'; }).join('') + '</div></section>';
    }).join('') || '<p class="muted">找不到。試其他字眼或條號。</p>';
  }
  render('');
  document.getElementById('q').addEventListener('input', function () { render(this.value); });
})();
</script>
</body>
</html>
